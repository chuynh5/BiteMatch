<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiteMatch Prototype Frames</title>
    <style>
      body {
        background: #fffaf5;
        color: #211c18;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }

      p {
        color: #756d65;
        margin: 0 0 24px;
      }

      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        background: #eadfd4;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(70, 43, 20, 0.14);
        display: block;
        width: 100%;
      }

      span {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>BiteMatch Prototype Frames</h1>
    <p>Import these SVGs into Figma and place them inside the phone screen.</p>
    <div class="grid">
      <a href="./01-mida-like.svg"><img src="./01-mida-like.svg" alt="Mida like frame" /><span>01 Mida like</span></a>
      <a href="./02-tora-pass.svg"><img src="./02-tora-pass.svg" alt="Tora pass frame" /><span>02 Tora pass</span></a>
      <a href="./03-lolita-like.svg"><img src="./03-lolita-like.svg" alt="Lolita like frame" /><span>03 Lolita like</span></a>
      <a href="./04-dakzen-pass.svg"><img src="./04-dakzen-pass.svg" alt="Dakzen pass frame" /><span>04 Dakzen pass</span></a>
      <a href="./05-match.svg"><img src="./05-match.svg" alt="Match frame" /><span>05 Match</span></a>
    </div>
  </body>
</html>
